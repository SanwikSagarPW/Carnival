<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sparky · Animation studio</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#edf0f6;font:15px system-ui}a{color:#ffa45d;text-decoration:none}header{padding:22px 32px;border-bottom:1px solid #2c303a;display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{letter-spacing:2px}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;max-width:1400px;margin:auto;padding:28px;gap:24px}.stage{background:#222d37;border:1px solid #353b46;border-radius:18px;position:relative;overflow:hidden}canvas{display:block;height:min(68vh,720px);max-width:100%;aspect-ratio:4/5;margin:auto}.controls{padding:18px;background:#181c24;border-top:1px solid #353b46;display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;border:1px solid #414652;border-radius:8px;padding:10px;background:#262b36;color:#edf0f6;cursor:pointer}button.primary{background:#ff883f;color:#20130c;border-color:#ff883f;font-weight:700}input[type=range]{accent-color:#ff883f;flex:1;min-width:100px}.side{background:#191d25;border:1px solid #303541;border-radius:18px;padding:24px;align-self:start}.eyebrow{color:#ff9a55;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}h1{font-size:27px;margin:12px 0}#path{font-size:12px;color:#9099aa;overflow-wrap:anywhere;line-height:1.7}label{display:block;color:#b7c0d0;margin:20px 0 8px}#clip{width:100%;max-width:100%}.meta{display:flex;justify-content:space-between;border-top:1px solid #303541;padding-top:18px;margin-top:20px;color:#aeb7c8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}#status{color:#aeb7c8;line-height:1.6;font-size:13px}.light{background:#eef3ef}.checker{background-color:#ccd1d4;background-image:linear-gradient(45deg,#b7bdc2 25%,transparent 25%),linear-gradient(-45deg,#b7bdc2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b7bdc2 75%),linear-gradient(-45deg,transparent 75%,#b7bdc2 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}.side{grid-row:1}canvas{height:60vh}header{padding:18px}}</style></head><body><header><a href="../index.html">← Animation library</a><strong>SPARKY / STUDIO</strong><span id="number"></span></header><main><section class="stage" id="stage"><canvas id="canvas" aria-label="Sparky animation preview"></canvas><div class="controls"><button id="pause" class="primary">Pause</button><button id="restart">Restart</button><input id="timeline" aria-label="Animation position" type="range" min="0" max="1000" value="0"><span id="time">0.00s</span></div></section><aside class="side"><p class="eyebrow" id="category">Loading character</p><h1 id="title">Sparky</h1><p id="path"></p><div class="actions"><button id="download" class="primary">Download animation ZIP ↓</button></div><p style="color:#aeb7c8;font-size:12px;line-height:1.6">Spine skeleton · texture sheets · PNG artwork · player</p><label for="clip">Animation</label><select id="clip"></select><div class="actions"><button id="previous">← Previous</button><button id="next">Next →</button></div><div class="meta"><span id="kind"></span><span id="duration"></span></div><label for="speed">Playback speed</label><select id="speed"><option value="0.35">0.35× · slow motion</option><option value="1" selected>1× · normal</option><option value="2">2× · fast</option></select><label><input id="loop" type="checkbox" checked> Repeat preview</label><label for="background">Background</label><select id="background"><option value="">Dark</option><option value="light">Light</option><option value="checker">Transparency grid</option></select><div class="actions"><button id="png">Save frame PNG</button><button id="copy">Copy animation name</button></div><p id="status" role="status">Loading the bundled character…</p></aside></main><script type="module">
import{SparkyRigPlayer}from'./player.js';import{downloadAnimationZip}from'./export-pack.js';const $=id=>document.getElementById(id);
try{
 const rig=await SparkyRigPlayer.load(),clips=rig.manifest.animations;let current,paused=false,scrubbed=false,start=rig.time;
 const view=rig.add($('canvas'),clips[0].name);
 for(const category of new Set(clips.map(c=>c.category))){const group=document.createElement('optgroup');group.label=category;for(const c of clips.filter(c=>c.category===category))group.append(new Option(c.title+(c.kind==='pose'?' [pose]':'')+' · '+c.name.split('/').slice(0,-1).join('/'),c.id));$('clip').append(group)}
 function play(id){current=clips.find(c=>c.id===id)??clips[0];$('clip').value=current.id;view.setAnimation(current.name,{loop:$('loop').checked&&current.duration>0,mixSeconds:0});rig.setPaused(false);paused=false;scrubbed=false;start=rig.time;$('pause').textContent='Pause';$('title').textContent=current.title;$('category').textContent=current.category;$('path').textContent=current.name;$('kind').textContent=current.kind==='pose'?'Still pose':current.loop?'Looping action':'One-shot action';$('duration').textContent=current.duration.toFixed(2)+'s';$('number').textContent=`${clips.indexOf(current)+1} / ${clips.length}`;$('status').textContent=current.kind==='pose'?'A still pose from the original animation set.':'Drag the timeline to inspect a pose. Replay restarts the action.';history.replaceState(null,'','?animation='+encodeURIComponent(current.id))}
 play(new URLSearchParams(location.search).get('animation')??clips.find(c=>c.title==='Idle EB')?.id);
 $('clip').onchange=()=>play($('clip').value);$('previous').onclick=()=>play(clips[(clips.indexOf(current)+clips.length-1)%clips.length].id);$('next').onclick=()=>play(clips[(clips.indexOf(current)+1)%clips.length].id);
 $('pause').onclick=()=>{if(scrubbed){play(current.id);return}paused=!paused;rig.setPaused(paused);$('pause').textContent=paused?'Play':'Pause'};$('restart').onclick=()=>play(current.id);$('loop').onchange=()=>play(current.id);$('speed').onchange=()=>rig.setSpeed(+$('speed').value);
 $('timeline').oninput=()=>{const t=+$('timeline').value/1000*current.duration;rig.setPaused(true);view.seek(t);paused=true;scrubbed=true;$('pause').textContent='Replay';$('time').textContent=t.toFixed(2)+'s'};
 function tick(){if(!scrubbed){let t=Math.max(0,rig.time-start);t=$('loop').checked&&current.duration>0?t%current.duration:Math.min(t,current.duration);$('timeline').value=current.duration?t/current.duration*1000:0;$('time').textContent=t.toFixed(2)+'s'}requestAnimationFrame(tick)}tick();
 $('background').onchange=()=>$('stage').className='stage '+$('background').value;
 $('png').onclick=()=>{const link=document.createElement('a');link.download='sparky-'+current.id+'.png';link.href=$('canvas').toDataURL('image/png');link.click();$('status').textContent='Frame saved with a transparent background.'};
 $('download').onclick=async()=>{const button=$('download'),clip=current;button.disabled=true;button.textContent='Preparing ZIP…';try{const result=await downloadAnimationZip([clip],{manifest:rig.manifest,onProgress:(i,total)=>{$('status').textContent=`Packing animation resources ${i}/${total}…`}});$('status').textContent=`${clip.title}: ZIP downloaded with Spine skeleton, texture sheets, painted parts, metadata, preview and player (${(result.bytes/1048576).toFixed(1)} MB).`}catch(error){$('status').textContent='Download failed: '+error.message}finally{button.disabled=false;button.textContent='Download animation ZIP ↓'}};
 $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(current.name);$('status').textContent='Animation name copied.'}catch{$('status').textContent=current.name}};
}catch(error){$('status').textContent='Unable to load preview: '+error.message;console.error(error)}
</script></body></html>
