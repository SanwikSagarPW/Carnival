<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#38bdf8">
  <title>Sparky's Carnival Quest — Preschool Learning Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Nunito:wght@700;800;900;1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=carnival-childish-v5">
</head>
<body>
  <main class="game-shell">

    <!-- ═══ SCENIC CARNIVAL MIDWAY BACKGROUND LAYER ═══ -->
    <div class="scenery-layer" aria-hidden="true">

      <!-- Panoramic Carnival Midway Illustration (Tents, Ferris Wheel, Carousel) -->
      <div class="scenery-midway"></div>

      <!-- Glowing Carnival Marquee Bulbs String -->
      <div class="carnival-lights">
        <span class="bulb bulb-red"></span>
        <span class="bulb bulb-yellow"></span>
        <span class="bulb bulb-green"></span>
        <span class="bulb bulb-blue"></span>
        <span class="bulb bulb-pink"></span>
        <span class="bulb bulb-yellow"></span>
        <span class="bulb bulb-red"></span>
        <span class="bulb bulb-green"></span>
        <span class="bulb bulb-blue"></span>
        <span class="bulb bulb-yellow"></span>
        <span class="bulb bulb-pink"></span>
        <span class="bulb bulb-red"></span>
        <span class="bulb bulb-green"></span>
        <span class="bulb bulb-yellow"></span>
        <span class="bulb bulb-blue"></span>
        <span class="bulb bulb-pink"></span>
        <span class="bulb bulb-red"></span>
        <span class="bulb bulb-yellow"></span>
        <span class="bulb bulb-green"></span>
        <span class="bulb bulb-blue"></span>
      </div>

      <!-- Smiling Sun with gentle rotating rays in top-right -->
      <div class="scenery-sun-wrap">
        <img class="scenery-sun-art" src="./assets/sun-smiling.svg" alt="">
      </div>

      <!-- Cheerful Pastel Rainbow -->
      <img class="scenery-rainbow" src="./assets/rainbow.svg" alt="">

      <!-- Festive Fluttering Bunting Garland -->
      <img class="scenery-bunting" src="./assets/bunting.svg" alt="">

      <!-- Soft Drifting Fairground Clouds -->
      <img class="scenery-cloud cloud-1" src="./assets/cloud-happy.svg" alt="">
      <img class="scenery-cloud cloud-2" src="./assets/cloud-happy.svg" alt="">
      <img class="scenery-cloud cloud-3" src="./assets/cloud-happy.svg" alt="">
      <img class="scenery-cloud cloud-4" src="./assets/cloud-happy.svg" alt="">

      <!-- Rolling Green Grassy Hills with Swaying Daisies -->
      <div class="scenery-hills">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 0 60 Q 300 18 600 48 Q 900 78 1200 38 L 1200 120 L 0 120 Z" fill="#86efac" opacity="0.6"/>
          <path d="M 0 78 Q 250 42 550 72 Q 850 32 1200 62 L 1200 120 L 0 120 Z" fill="#4ade80"/>
        </svg>
        <div class="hill-flowers">
          <img class="daisy daisy-1" src="./assets/flower-daisy.svg" alt="">
          <img class="daisy daisy-2" src="./assets/flower-daisy.svg" alt="">
          <img class="daisy daisy-3" src="./assets/flower-daisy.svg" alt="">
          <img class="daisy daisy-4" src="./assets/flower-daisy.svg" alt="">
          <img class="daisy daisy-5" src="./assets/flower-daisy.svg" alt="">
        </div>
      </div>

      <!-- Interactive Floating Soap Bubbles (toddlers can pop them!) -->
      <div class="bubble-field" id="bubble-field"></div>
    </div>

    <!-- ═══ TOP CARNIVAL HUD BAR ═══ -->
    <header class="top-hud">
      <div class="hud-left">
        <button class="hud-logo bubble-btn" id="hud-home-logo" aria-label="Go to Main Menu" type="button">
          <img class="hud-logo-icon" src="./assets/cocomelon-melon.svg" alt="Sparky's Carnival">
          <div class="hud-logo-text">
            <span class="hud-logo-title">Sparky's</span>
            <span class="hud-logo-sub">CARNIVAL</span>
          </div>
        </button>
        <div class="hud-stars cloud-pill" aria-label="Stars collected">
          <img class="star-icon-spin" src="./assets/cocomelon-star.svg" alt="Stars">
          <span class="hud-stars-count" id="star-count">0</span>
        </div>
      </div>

      <div class="hud-center">
        <span class="hud-banner-badge">🎪 CARNIVAL ADVENTURE 🎪</span>
      </div>

      <div class="hud-actions">
        <button class="hud-btn hud-btn-sound bubble-btn" id="sound-toggle" aria-label="Mute sound effects" title="Sound Effects" type="button">
          <img id="sound-icon" src="./assets/icon-speaker.svg" alt="Sound">
        </button>
        <button class="hud-btn hud-btn-home bubble-btn" id="hud-main-menu" aria-label="Main menu" title="Main Menu" type="button">
          <img src="./assets/icon-home.svg" alt="Home">
        </button>
        <button class="hud-btn hud-btn-restart bubble-btn" id="hud-restart" aria-label="Restart round" title="Restart" type="button">
          <img src="./assets/icon-restart.svg" alt="Restart">
        </button>
      </div>
    </header>

    <!-- ═══ MAIN ACTIVITY PLAY AREA ═══ -->
    <section class="play-area">

      <!-- Sparky the Lion Guide Character -->
      <div class="character-wrap" id="character-wrap" role="button" tabindex="0" aria-label="Sparky the Guide (tap to tickle!)">
        <canvas id="sparky" width="512" height="640"></canvas>
        <div class="character-shadow"></div>
        <div class="speech-bubble cloud-bubble" id="speech-bubble">
          <p id="speech">Welcome to play time!</p>
        </div>
      </div>

      <!-- Main Activity Carnival Booth Panel -->
      <div class="content-panel cloud-panel" id="content-panel"></div>

      <!-- Sparkle & Starburst Particles Layer -->
      <div class="effects-layer" id="effects-layer" aria-hidden="true"></div>

      <!-- Encouraging Feedback Toast -->
      <div class="feedback cloud-pill" id="feedback" role="status" aria-live="polite"></div>

    </section>

    <!-- ═══ BOTTOM FOOTER BAR ═══ -->
    <footer class="bottom-bar">
      <span class="footer-tagline">🎠 Play at your own pace • Every try is a great try! 🫧</span>
      <div class="footer-actions">
        <button id="main-menu-btn" class="restart-button bubble-pill" type="button">
          <img src="./assets/icon-home.svg" alt=""> <span>Main Menu</span>
        </button>
        <button id="restart" class="restart-button bubble-pill" type="button">
          <img src="./assets/icon-restart.svg" alt=""> <span>Play Again</span>
        </button>
      </div>
    </footer>

  </main>

  <script type="module" src="game.js?v=carnival-childish-v5"></script>
</body>
</html>
