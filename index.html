<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6ec6ff">
  <title>Sparky's Carnival</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=kids-ui-1">
</head>
<body>
  <main class="game" id="game" data-screen="splash" data-theme="meadow">

    <!-- top ribbon -->
    <div class="ribbon-wrap"><h1 class="ribbon" id="ribbon">Sparky's Carnival</h1></div>

    <!-- corner buttons -->
    <button class="candy candy-red btn-close" id="btn-home" type="button" aria-label="Back to games" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 13 35 35M35 13 13 35" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none"/></svg>
    </button>

    <div class="corner-left">
      <button class="candy candy-blue btn-sound" id="btn-sound" type="button" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M8 19h8l10-8v26l-10-8H8z" fill="#fff"/>
          <g class="waves" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"><path d="M31 18c3 3 3 9 0 12"/><path d="M36 13c6 6 6 16 0 22"/></g>
          <path class="slash" d="M30 17 42 31M42 17 30 31" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
      <div class="stars-pill" id="stars-pill" aria-label="Stars won">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 5 5.6 12.2 13.4 1.4-10 9 2.9 13.2L24 34 12.1 40.8 15 27.6l-10-9 13.4-1.4z" fill="#ffd23f" stroke="#e8a100" stroke-width="3" stroke-linejoin="round"/></svg>
        <b id="star-count">0</b>
      </div>
    </div>

    <!-- Sparky -->
    <div class="character" id="character" role="button" tabindex="0" aria-label="Sparky">
      <canvas id="sparky" width="512" height="640"></canvas>
    </div>

    <!-- activity -->
    <section class="stage" id="stage" aria-live="polite"></section>

    <!-- next / play -->
    <button class="candy candy-orange btn-next" id="btn-next" type="button" aria-label="Next" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 24h26M25 12l13 12-13 12" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
    </button>

    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

  <script type="module" src="game.js?v=kids-ui-1"></script>
</body>
</html>
