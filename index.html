<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#27c3f0">
  <title>Sparky's Carnival</title>
  <link rel="icon" href="assets/sparky-poster.webp?v=2" type="image/webp">
  <link rel="preload" href="assets/bg-park.webp" as="image" type="image/webp" fetchpriority="high">
  <link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/sparky-poster.webp?v=2" as="image" type="image/webp">
  <link rel="modulepreload" href="audio.js">
  <link rel="modulepreload" href="dialogues.js">
  <link rel="modulepreload" href="timers.js">
  <link rel="modulepreload" href="sparky-animations/player.js">
  <link rel="modulepreload" href="sparky-animations/runtime/character-upgrade/12-sparky-final/player.js">
  <link rel="modulepreload" href="sparky-animations/runtime/character-upgrade/12-sparky-final/motion-fit-painted.js?gesture-fit=2">
  <link rel="stylesheet" href="style.css?v=carnival-95">
</head>
<body>
  <main class="game" id="game" data-screen="splash" data-theme="meadow" inert>
    <!-- corner buttons -->
    <button class="candy btn-pause" id="btn-pause" type="button" aria-label="Pause game">
      <svg viewBox="0 0 48 48" aria-hidden="true"><g class="ic"><rect x="11" y="8" width="10" height="32" rx="4"/><rect x="27" y="8" width="10" height="32" rx="4"/></g></svg>
    </button>

    <div class="corner-left">
      <button class="candy candy-blue btn-sound" id="btn-sound" type="button" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g class="ic"><rect x="5" y="16" width="9" height="16" rx="2.5"/><path d="M16 17 30 6v36L16 31z"/></g>
          <path class="waves" d="M36 17c4 4.5 4 9.5 0 14" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
          <g class="slash"><path d="M10 8 41 40" stroke="#b9301a" stroke-width="8" stroke-linecap="round"/><path d="M10 8 41 40" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
        </svg>
      </button>
    </div>

    <div class="stars-pill" id="stars-pill" aria-label="Stars won">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="star-fill" x2="0" y2="1"><stop stop-color="#fff08a"/><stop offset=".55" stop-color="#ffc928"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient></defs>
        <path d="m24 4 6 13 14 1.5-10.4 9.5 3 14L24 34.6 11.4 42l3-14L4 18.5 18 17z" fill="url(#star-fill)" stroke="#d97f00" stroke-width="3" stroke-linejoin="round"/>
        <path d="M17 17.5 23 9" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
      </svg>
      <b id="star-count">0</b>
    </div>

    <!-- Sparky -->
    <div class="character" id="character" role="button" tabindex="0" aria-label="Sparky">
      <img class="poster" src="assets/sparky-poster.webp?v=2" alt="" width="512" height="640" decoding="async" draggable="false">
      <canvas id="sparky" width="512" height="640"></canvas>
      <span class="sole-contact" aria-hidden="true"></span>
      <span id="actor-status" class="actor-status" role="status"></span>
    </div>

    <!-- activity -->
    <section class="puzzle-frame" aria-labelledby="ribbon">
      <div class="tent-interior" aria-hidden="true"></div>
      <svg class="valance" viewBox="0 0 900 160" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="tent-red" x2="0" y2="1">
            <stop stop-color="#ff827e"/><stop offset=".55" stop-color="#ef5263"/><stop offset="1" stop-color="#ce354e"/>
          </linearGradient>
          <linearGradient id="tent-cream" x2="0" y2="1">
            <stop stop-color="#fffef4"/><stop offset=".7" stop-color="#fff7df"/><stop offset="1" stop-color="#f4dfb6"/>
          </linearGradient>
          <linearGradient id="tent-gold" x2="0" y2="1">
            <stop stop-color="#ffe9a0"/><stop offset=".5" stop-color="#ffc75b"/><stop offset="1" stop-color="#d89135"/>
          </linearGradient>
          <linearGradient id="tent-roof-side" x2="1" y2="0">
            <stop stop-color="#5a1030" stop-opacity=".34"/><stop offset=".3" stop-color="#5a1030" stop-opacity="0"/>
            <stop offset=".7" stop-color="#5a1030" stop-opacity="0"/><stop offset="1" stop-color="#5a1030" stop-opacity=".34"/>
          </linearGradient>
          <linearGradient id="tent-roof-top" x2="0" y2="1">
            <stop offset=".15" stop-color="#fff" stop-opacity=".42"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="tent-roof-clip">
            <path d="M0 114C230 108 380 68 450 22C520 68 670 108 900 114V128H0Z"/>
          </clipPath>
          <path id="tent-scallop" d="M0 116H90V127C90 150 0 150 0 127Z"/>
        </defs>
        <g clip-path="url(#tent-roof-clip)">
          <path d="M0 0H900V130H0Z" fill="url(#tent-cream)"/>
          <g fill="url(#tent-red)">
            <path d="M450 22 405 130H495Z"/>
            <path d="M450 22 225 130H315Z"/>
            <path d="M450 22 585 130H675Z"/>
            <path d="M450 22 45 130H135Z"/>
            <path d="M450 22 765 130H855Z"/>
          </g>
          <path d="M0 0H900V130H0Z" fill="url(#tent-roof-side)"/>
          <path d="M0 0H900V130H0Z" fill="url(#tent-roof-top)"/>
        </g>
        <path d="M0 114C230 108 380 68 450 22C520 68 670 108 900 114" fill="none" stroke="#b9780a" stroke-width="8" stroke-linecap="round"/>
        <path d="M0 114C230 108 380 68 450 22C520 68 670 108 900 114" fill="none" stroke="url(#tent-gold)" stroke-width="4.5" stroke-linecap="round"/>
        <g stroke="#ba4050" stroke-width="1.5">
          <use href="#tent-scallop" fill="url(#tent-red)"/>
          <use href="#tent-scallop" x="90" fill="url(#tent-cream)"/>
          <use href="#tent-scallop" x="180" fill="url(#tent-red)"/>
          <use href="#tent-scallop" x="270" fill="url(#tent-cream)"/>
          <use href="#tent-scallop" x="360" fill="url(#tent-red)"/>
          <use href="#tent-scallop" x="450" fill="url(#tent-cream)"/>
          <use href="#tent-scallop" x="540" fill="url(#tent-red)"/>
          <use href="#tent-scallop" x="630" fill="url(#tent-cream)"/>
          <use href="#tent-scallop" x="720" fill="url(#tent-red)"/>
          <use href="#tent-scallop" x="810" fill="url(#tent-cream)"/>
        </g>
        <path d="M3 117Q450 124 897 117" fill="none" stroke="#a83b48" stroke-width="8" stroke-linecap="round"/>
        <path d="M3 115Q450 122 897 115" fill="none" stroke="url(#tent-gold)" stroke-width="5" stroke-linecap="round"/>
        <g fill="url(#tent-gold)" stroke="#b9780a" stroke-width="1.5">
          <circle cx="90" cy="128" r="4.5"/><circle cx="180" cy="128" r="4.5"/><circle cx="270" cy="128" r="4.5"/>
          <circle cx="360" cy="128" r="4.5"/><circle cx="450" cy="128" r="4.5"/><circle cx="540" cy="128" r="4.5"/>
          <circle cx="630" cy="128" r="4.5"/><circle cx="720" cy="128" r="4.5"/><circle cx="810" cy="128" r="4.5"/>
        </g>
      </svg>
      <svg class="tent-flag" viewBox="0 0 40 62" aria-hidden="true">
        <rect x="12.6" y="9" width="2.8" height="42" rx="1.4" fill="#9a5a39"/>
        <circle cx="14" cy="7" r="3" fill="url(#tent-gold)" stroke="#b9780a" stroke-width="1"/>
        <g class="flag-cloth">
          <path d="M15.4 10Q27 6 39 11L33 17.5L39 24Q27 28 15.4 25Z" fill="url(#tent-red)" stroke="#a83b48" stroke-width="1" stroke-linejoin="round"/>
          <path d="M15.4 15.5Q27 12 36 15.6L34.5 18.5Q26 15.5 15.4 19.5Z" fill="#fffef4" opacity=".9"/>
        </g>
        <path d="M3 62C3 52 7 47 14 47s11 5 11 15Z" fill="url(#tent-gold)" stroke="#b9780a" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8 58Q9 52 13 50" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="tent-bulbs" aria-hidden="true"></div>
      <svg class="tent-curtain tent-curtain-left" viewBox="0 0 100 560" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="tent-fabric">
            <stop stop-color="#a92e46"/><stop offset=".2" stop-color="#f66b78"/><stop offset=".4" stop-color="#d9425e"/>
            <stop offset=".6" stop-color="#ff8790"/><stop offset=".8" stop-color="#df4c65"/><stop offset="1" stop-color="#b6324b"/>
          </linearGradient>
          <path id="tent-drape-outline" d="M0 0H100C96 74 68 128 39 184C20 222 25 292 46 384L69 542Q42 559 0 550Z"/>
          <clipPath id="tent-drape-clip"><use href="#tent-drape-outline"/></clipPath>
          <g id="tent-drape">
            <use href="#tent-drape-outline" fill="url(#tent-fabric)" stroke="#a53248" stroke-width="2"/>
            <g clip-path="url(#tent-drape-clip)" fill="none" stroke-linecap="round">
              <path d="M24 0Q38 112 22 211Q9 367 21 555M61 0Q55 123 29 211Q27 352 46 555" stroke="#8e2644" stroke-opacity=".28" stroke-width="5"/>
              <path d="M35 0Q46 115 27 206M78 0Q64 130 35 210M30 240Q34 388 58 540" stroke="#ffb0ac" stroke-opacity=".55" stroke-width="3"/>
            </g>
          </g>
        </defs>
        <use href="#tent-drape"/>
      </svg>
      <svg class="tent-curtain tent-curtain-right" viewBox="0 0 100 560" preserveAspectRatio="none" aria-hidden="true"><use href="#tent-drape"/></svg>
      <svg class="tent-tie tent-tie-left" viewBox="0 0 40 68" aria-hidden="true"><use href="#tent-tie-art"/></svg>
      <svg class="tent-tie tent-tie-right" viewBox="0 0 40 68" aria-hidden="true"><use href="#tent-tie-art"/></svg>
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <g id="tent-tie-art">
          <path d="M20 14C23 24 23 30 20 36" fill="none" stroke="#b97a2e" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M20 14C23 24 23 30 20 36" fill="none" stroke="#ffd45f" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M2 8Q20 0 38 9L36 19Q20 12 4 18Z" fill="url(#tent-gold)" stroke="#b97a2e" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="20" cy="40" r="5.5" fill="url(#tent-gold)" stroke="#b97a2e" stroke-width="1.5"/>
          <path d="M14 44h12l3.5 20Q20 68 10.5 64Z" fill="url(#tent-gold)" stroke="#b97a2e" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M16 48l-2 15M20 48v18M24 48l2 15" stroke="#b97a2e" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/>
        </g>
      </svg>
      <header class="board-heading">
        <p class="eyebrow" id="eyebrow">Play, discover, grow</p>
        <h1 class="ribbon" id="ribbon">Sparky's Carnival</h1>
        <p class="instruction" id="instruction">Little games. Big discoveries.</p>
      </header>
      <section class="stage" id="stage"></section>
      <footer class="board-footer">
        <p id="feedback" role="status" aria-live="polite">Sparky is here to help.</p>
        <button class="hear-button" id="btn-hear" type="button" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 19h9l10-8v26L16 29H7z" fill="currentColor"/><path d="M33 15q12 9 0 18" stroke="currentColor" fill="none" stroke-width="4" stroke-linecap="round"/></svg>
          Hear it
        </button>
      </footer>
      <div class="round-loading" id="round-loading" role="status">
        <span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <p id="loading-message">Getting your games ready...</p>
        <button class="text-action" id="btn-retry" type="button" hidden>Try loading again</button>
      </div>
    </section>

    <!-- next / play -->
    <button class="candy btn-next" id="btn-next" type="button" aria-label="Next" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true"><path class="ic" d="M7 19h15v-9l19 14-19 14v-9H7z"/></svg>
    </button>

    <div class="fx" id="fx" aria-hidden="true"></div>
  </main>

  <dialog class="pause-dialog" id="pause-dialog" aria-labelledby="pause-title">
    <h2 id="pause-title">Game paused</h2>
    <div class="pause-actions">
      <button id="btn-resume" type="button" autofocus>
        <span class="dialog-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="ic" d="M15 8v32l26-16z"/></svg></span>
        Keep playing
      </button>
      <button id="btn-start" type="button">
        <span class="dialog-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="ic" d="M24 7 6 23h5v17h26V23h5z"/><path d="M20 28h8v12h-8z" fill="#b9301a" stroke="none"/></svg></span>
        Back to start
      </button>
    </div>
  </dialog>
  <section class="rotate-prompt" role="status" aria-live="polite">
    <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="31" y="15" width="38" height="68" rx="8" fill="none" stroke="currentColor" stroke-width="5" transform="rotate(-30 50 50)"/><path d="M12 31q8-19 29-20m-6-7 9 8-9 8M88 69q-8 19-29 20m6 7-9-8 9-8" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>Turn your screen to play</h2>
    <p>Sparky needs a little more room.<br>Hold your device sideways.</p>
  </section>
  <noscript><p class="no-script">Please enable JavaScript to play with Sparky.</p></noscript>
  <script id="game-code" type="module" src="game.js?v=carnival-80"></script>
  <script>
    document.getElementById('game-code').addEventListener('error', function () {
      document.getElementById('loading-message').textContent = 'The game could not connect. Please try again.';
      document.getElementById('game').inert = false;
      document.querySelectorAll('.candy').forEach(function (button) { button.disabled = true; });
      var retry = document.getElementById('btn-retry');
      retry.hidden = false;
      retry.addEventListener('click', function () { location.reload(); });
    });
  </script>
</body>
</html>
